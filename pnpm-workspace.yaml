# pnpm 11 blocks install scripts by default and asks you to decide one by one.
# `maplibre-gl` is denied on purpose: it comes in as a transitive dependency of Unovis
# through its map components, which this project does not use.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  vue-demi: true
  maplibre-gl: false
